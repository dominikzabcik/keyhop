name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STATIC_SDK_URL: https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
  STATIC_SDK_CHECKSUM: 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
  NFPM_VERSION: 2.47.0

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: swift test

      - name: Build universal app
        run: ./scripts/build-app.sh

      - name: Check the bundle
        run: |
          lipo -archs build/Switchr.app/Contents/MacOS/Switchr | grep -q x86_64
          lipo -archs build/Switchr.app/Contents/MacOS/Switchr | grep -q arm64
          plutil -lint build/Switchr.app/Contents/Info.plist
          codesign --verify build/Switchr.app
          # switchr:// opens the app's window.
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw build/Switchr.app/Contents/Info.plist | grep -qx switchr
          build/Switchr.app/Contents/MacOS/Switchr version
          # Linked as `switchr`, the app binary is the command.
          ln -s "$PWD/build/Switchr.app/Contents/MacOS/Switchr" "$RUNNER_TEMP/switchr"
          "$RUNNER_TEMP/switchr" status --sample

      - name: Render menu snapshots and the sample dashboard page
        run: |
          build/Switchr.app/Contents/MacOS/Switchr --snapshot "$RUNNER_TEMP/switchr"
          build/Switchr.app/Contents/MacOS/Switchr insights --sample --no-open --output "$RUNNER_TEMP/switchr-insights.html"

      - name: Lint scripts and manifests
        run: |
          brew install shellcheck
          shellcheck install.sh scripts/*.sh packaging/linux/install-local.sh
          python3 -m py_compile packaging/linux/switchr-tray scripts/render-manifests.py
          ruby -c Casks/switchr.rb

      - uses: actions/upload-artifact@v7
        with:
          name: macos-screens
          path: |
            ${{ runner.temp }}/switchr-*.png
            ${{ runner.temp }}/switchr-insights.html
          if-no-files-found: warn

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            nfpm: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            nfpm: arm64
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the static Linux SDK and nfpm
        run: |
          # Ubuntu's mirror sometimes serves a half-synced index; retry, then switch to another mirror.
          for attempt in 1 2 3; do
            apt-get update -qq || true
            if apt-get install -y -qq curl python3 >/dev/null; then break; fi
            sed -i 's|http://archive.ubuntu.com/ubuntu|http://mirrors.edge.kernel.org/ubuntu|g; s|http://ports.ubuntu.com/ubuntu-ports|http://mirrors.edge.kernel.org/ubuntu-ports|g' /etc/apt/sources.list.d/ubuntu.sources || true
            sleep 15
          done
          command -v curl >/dev/null
          swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz" | tar -xz -C /usr/local/bin nfpm

      - name: Run tests
        run: swift test

      - name: Build the binary and packages
        run: |
          scripts/package-linux.sh
          cd build/linux && sha256sum -- * > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: build/linux/*

  linux-install:
    name: ${{ matrix.name }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora (RPM)
            image: fedora:latest
            runner: ubuntu-24.04
            artifact: linux-x86_64
            install: dnf install -y artifacts/*.rpm
            tray: true
          - name: Fedora aarch64 (RPM)
            image: fedora:latest
            runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            install: dnf install -y artifacts/*.rpm
            tray: true
          - name: Ubuntu 24.04 (DEB)
            image: ubuntu:24.04
            runner: ubuntu-24.04
            artifact: linux-x86_64
            # Required dependencies only: optional extras like the WebKit window would pull a whole desktop into CI.
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./artifacts/*.deb
            tray: true
          - name: Ubuntu 24.04 aarch64 (DEB)
            image: ubuntu:24.04
            runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            # Required dependencies only: optional extras like the WebKit window would pull a whole desktop into CI.
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./artifacts/*.deb
            tray: true
          - name: Debian 12 (DEB)
            image: debian:12
            runner: ubuntu-24.04
            artifact: linux-x86_64
            # Required dependencies only: optional extras like the WebKit window would pull a whole desktop into CI.
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./artifacts/*.deb
            tray: true
          - name: Arch Linux (package)
            image: archlinux:latest
            runner: ubuntu-24.04
            artifact: linux-x86_64
            install: pacman -Syu --noconfirm && pacman -U --noconfirm artifacts/*.pkg.tar.zst
            tray: true
          - name: Arch Linux (PKGBUILD)
            image: archlinux:latest
            runner: ubuntu-24.04
            artifact: linux-x86_64
            install: |
              pacman -Syu --noconfirm --needed base-devel python sudo
              version=$(ls artifacts/switchr-*-linux-x86_64.tar.gz | sed 's/.*switchr-\(.*\)-linux-.*/\1/')
              python3 scripts/render-manifests.py --version "$version" --sums artifacts/SHA256SUMS --out "$RUNNER_TEMP/rendered" --local-sources
              useradd -m builder && mkdir /tmp/pkg && cp "$RUNNER_TEMP/rendered/packaging/arch/PKGBUILD" artifacts/*.tar.gz /tmp/pkg/ && chown -R builder /tmp/pkg
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              su builder -c "cd /tmp/pkg && makepkg --syncdeps --noconfirm"
              pacman -U --noconfirm /tmp/pkg/switchr-bin-*.pkg.tar.zst
            tray: true
          - name: Fedora (install.sh)
            image: fedora:latest
            runner: ubuntu-24.04
            artifact: linux-x86_64
            install: SWITCHR_INSTALL_FROM=artifacts bash install.sh
            tray: true
          - name: Ubuntu 24.04 (install.sh)
            image: ubuntu:24.04
            runner: ubuntu-24.04
            artifact: linux-x86_64
            install: apt-get update -qq && echo 'APT::Install-Recommends "0";' > /etc/apt/apt.conf.d/99switchr-ci && SWITCHR_INSTALL_FROM=artifacts bash install.sh
            tray: true
          - name: openSUSE (install.sh, portable)
            image: opensuse/tumbleweed:latest
            runner: ubuntu-24.04
            artifact: linux-x86_64
            install: zypper --non-interactive install tar gzip python3 curl && SWITCHR_INSTALL_FROM=artifacts bash install.sh && ln -s "$HOME/.local/bin/switchr" "$HOME/.local/bin/switchr-tray" /usr/local/bin/
            tray: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: artifacts

      - name: Install
        shell: bash
        run: ${{ matrix.install }}

      - name: Run switchr
        shell: bash
        env:
          SWITCHR_SECRET_STORE: file
        run: |
          switchr version
          switchr doctor
          switchr status --json > status.json
          switchr-tray --print-menu status.json
          switchr status --sample --json > sample.json
          switchr-tray --print-menu sample.json
          switchr insights --no-open --no-read --output insights.html
          # GitHub may rate-limit this runner, but a certificate problem must never happen.
          out=$(switchr update --check 2>&1) || true
          echo "$out"
          if grep -qi certificate <<<"$out"; then exit 1; fi

      - name: Load the tray's libraries
        if: matrix.tray
        run: python3 -c 'import gi; gi.require_version("Gtk", "3.0"); gi.require_version("AyatanaAppIndicator3", "0.1"); gi.require_version("Notify", "0.7"); from gi.repository import Gtk, AyatanaAppIndicator3, Notify'

  linux-screens:
    name: Linux tray screenshots
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64
          path: artifacts

      - name: Install Switchr and a virtual display
        run: dnf install -y artifacts/*.rpm xorg-x11-server-Xvfb dbus-daemon ImageMagick google-noto-sans-fonts webkit2gtk4.1 >/dev/null

      - name: Capture the tray's menu, a prompt and the dashboard
        env:
          # WebKit's own sandbox can't start inside an unprivileged CI container.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime && mkdir -m 700 -p $XDG_RUNTIME_DIR
          switchr status --sample --json > sample.json
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99 && sleep 2

          switchr dashboard --sample --no-open --json > dashboard.json 2> dashboard.log &
          server=$!
          sleep 3
          url=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' dashboard.json)
          cat > window.py <<'PY'
          import sys
          import gi
          gi.require_version("Gtk", "3.0")
          gi.require_version("WebKit2", "4.1")
          from gi.repository import Gtk, WebKit2
          window = Gtk.Window(title="Switchr")
          window.set_decorated(False)
          window.set_default_size(1440, 900)
          window.move(0, 0)
          view = WebKit2.WebView()
          view.load_uri(sys.argv[1])
          window.add(view)
          window.show_all()
          Gtk.main()
          PY
          timeout 40 dbus-run-session -- python3 window.py "$url" > webkit.log 2>&1 &
          window=$!
          sleep 15
          import -window root linux-dashboard.png
          # Wait only for the window: the server and the display keep running until they're stopped.
          wait "$window" || true
          kill "$server" 2>/dev/null || true
          grep -iE "error|traceback" webkit.log || true

          # Output goes to a file: accessibility helpers GTK starts outlive the session and would hold a pipe open.
          timeout 120 dbus-run-session -- sh -c '
            timeout 20 switchr-tray --status-file sample.json --show-menu & sleep 6
            import -window root linux-menu.png
            wait
            timeout 20 switchr-tray --status-file sample.json --show-dialog & sleep 6
            import -window root linux-dialog.png
            wait
          ' > tray.log 2>&1 || true
          grep -iE "error|traceback" tray.log || true
          pkill Xvfb || true
          ls -l linux-*.png

      - uses: actions/upload-artifact@v7
        with:
          name: linux-screens
          path: linux-*.png

  # Windows on Arm runs the x86_64 build through emulation: the Swift toolchain doesn't run on
  # GitHub's Arm Windows runners yet.
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: compnerd/gha-setup-swift@v0.4.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Run tests
        run: swift test

      - name: Build the zip
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          Push-Location build\windows
          Get-ChildItem *.zip | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_).Hash.ToLower())  $($_.Name)" } | Set-Content SHA256SUMS
          Pop-Location

      - name: Install with install.ps1 and run it
        shell: pwsh
        run: |
          $env:SWITCHR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'switchr-data'
          ./install.ps1 -From build\windows -NoStart
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Switchr'
          & "$installed\switchr.exe" version; if ($LASTEXITCODE) { exit 1 }
          & "$installed\switchr.exe" doctor; if ($LASTEXITCODE) { exit 1 }
          & "$installed\switchr.exe" insights --no-open --no-read --output "$env:RUNNER_TEMP\insights.html"; if ($LASTEXITCODE) { exit 1 }
          & "$installed\switchr.exe" status --sample --json | Set-Content "$env:RUNNER_TEMP\sample.json"
          & "$installed\switchr-tray.exe" --print-menu "$env:RUNNER_TEMP\sample.json" | Out-Host
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Switchr.lnk'))) { throw 'No Start menu shortcut' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Switchr -ErrorAction SilentlyContinue)) { throw 'Not set to open at sign-in' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $installed) { throw 'Not on PATH' }

          $tray = Start-Process -FilePath "$installed\switchr-tray.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($tray.HasExited) { throw "switchr-tray.exe exited with code $($tray.ExitCode)" }
          Stop-Process -Id $tray.Id

      - name: Capture the tray menu and a prompt
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Capture([string]$path) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save($path)
          }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Switchr'
          foreach ($shot in @(@('--show-menu', 'windows-menu'), @('--show-dialog', 'windows-dialog'))) {
            $tray = Start-Process -FilePath "$installed\switchr-tray.exe" -ArgumentList '--status-file', "$env:RUNNER_TEMP\sample.json", $shot[0] -PassThru
            Start-Sleep -Seconds 5
            Capture "$env:RUNNER_TEMP\$($shot[1])-${{ matrix.arch }}.png"
            Stop-Process -Id $tray.Id -ErrorAction SilentlyContinue
          }

      - name: Uninstall with install.ps1
        shell: pwsh
        run: |
          ./install.ps1 -Uninstall
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Switchr')) { throw 'Files left behind' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name Switchr -ErrorAction SilentlyContinue) { throw 'Still opens at sign-in' }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            build/windows/*.zip
            ${{ runner.temp }}/windows-*.png

  manifests:
    name: Package manifests
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Render and check them
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.rpm' -o -name '*.deb' -o -name '*.pkg.tar.zst' \) -exec cp {} dist/ \;
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          python3 scripts/render-manifests.py --version "$(cat VERSION)" --sums dist/SHA256SUMS --out rendered
          python3 -m json.tool rendered/bucket/switchr.json >/dev/null
          bash -n rendered/packaging/arch/PKGBUILD
          cat rendered/packaging/arch/PKGBUILD rendered/packaging/winget/*/*.yaml
