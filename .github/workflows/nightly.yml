name: Beta

# The Beta channel: every night, when the v2 branch has changed since the last Beta, publish the
# next 2.0.0-beta.N for macOS, Linux and Windows as a GitHub prerelease, through the Release
# workflow. A Beta can also go out any time by pushing a tag like v2.0.0-beta.7, or from here.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if v2 hasn't changed since the last Beta
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: keyhop-beta
  cancel-in-progress: false

env:
  BRANCH: v2
  NEXT: "2.0.0"

jobs:
  plan:
    name: Next Beta
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      ref: ${{ steps.next.outputs.ref }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - id: next
        env:
          FORCE: ${{ inputs.force }}
        run: |
          repo="https://github.com/${GITHUB_REPOSITORY}.git"
          ref="$(git ls-remote "$repo" "refs/heads/$BRANCH" | cut -f1)"
          [[ -n "$ref" ]] || { echo "No $BRANCH branch" >&2; exit 1; }
          last="$(git ls-remote --tags "$repo" "refs/tags/v$NEXT-beta.*" | grep -v '\^{}$' | sed 's|.*refs/tags/||' | sort -V | tail -n 1 || true)"
          number=1
          if [[ -n "$last" ]]; then
            number=$(( ${last##*.} + 1 ))
            built="$(git ls-remote --tags "$repo" "refs/tags/$last^{}" | cut -f1)"
            [[ -n "$built" ]] || built="$(git ls-remote --tags "$repo" "refs/tags/$last" | cut -f1)"
            if [[ "$built" == "$ref" && "$FORCE" != "true" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$BRANCH hasn't changed since $last, so there is no new Beta tonight."
              exit 0
            fi
          fi
          {
            echo "version=$NEXT-beta.$number"
            echo "ref=$ref"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing Keyhop $NEXT-beta.$number from $BRANCH @ ${ref:0:7}"

  release:
    name: Release
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.ref }}
    secrets: inherit
