name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  STATIC_SDK_URL: https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
  STATIC_SDK_CHECKSUM: 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
  NFPM_VERSION: 2.47.0

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$(cat VERSION)" != "$version" ]]; then
            echo "VERSION says $(cat VERSION) but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if ! grep -q "static let number = \"$version\"" Sources/Switchr/Core/Version.swift; then
            echo "Sources/Switchr/Core/Version.swift doesn't say $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

  macos:
    name: macOS
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: swift test

      - name: Install dmgbuild
        run: pip install dmgbuild

      - name: Build app, zip and disk image
        env:
          SWITCHR_VERSION: ${{ github.ref_name }}
        run: ./scripts/build-app.sh --release

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            build/Switchr.dmg
            build/Switchr.zip

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            nfpm: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            nfpm: arm64
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the static Linux SDK and nfpm
        run: |
          apt-get update -qq && apt-get install -y -qq curl python3 >/dev/null
          swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz" | tar -xz -C /usr/local/bin nfpm

      - name: Run tests
        run: swift test

      - name: Build the binary and packages
        env:
          SWITCHR_VERSION: ${{ github.ref_name }}
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: build/linux/*

  windows:
    name: Windows
    needs: check
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: compnerd/gha-setup-swift@v0.4.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Run tests
        run: swift test

      - name: Build the zip
        shell: pwsh
        env:
          SWITCHR_VERSION: ${{ github.ref_name }}
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: build/windows/*.zip

  publish:
    name: Publish
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md
            cat <<'NOTES'

          ### Install

          **macOS and Linux**

          ```bash
          curl -fsSL https://raw.githubusercontent.com/dominikzabcik/switchr/main/install.sh | bash
          ```

          **Windows** (PowerShell)

          ```powershell
          irm https://raw.githubusercontent.com/dominikzabcik/switchr/main/install.ps1 | iex
          ```

          | System | Download |
          | --- | --- |
          | macOS 14 or later | `Switchr.dmg`, or `brew install --cask switchr` from this repository's tap |
          | Fedora, RHEL | `switchr-VERSION-1.x86_64.rpm` or `.aarch64.rpm` |
          | Debian, Ubuntu | `switchr_VERSION_amd64.deb` or `_arm64.deb` |
          | Arch Linux | `switchr-VERSION-1-x86_64.pkg.tar.zst` or `-aarch64` |
          | Any Linux | `switchr-VERSION-linux-<arch>.tar.gz`, then `./install-local.sh` |
          | Windows 10 and 11 | `switchr-VERSION-windows-x86_64.zip`, or `scoop install switchr` from this repository's bucket |

          Every file is listed with its SHA-256 in `SHA256SUMS`.
          NOTES
          } | sed 's/^          //' | sed "s/VERSION/$version/g" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Switchr ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

      - name: Point the Scoop manifest at this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="switchr-$version-windows-x86_64.zip"
          hash=$(awk -v f="$zip" '$2 == f {print $1}' dist/SHA256SUMS)
          python3 - "$version" "$zip" "$hash" <<'PY'
          import json, sys
          version, zip_name, digest = sys.argv[1:]
          path = "bucket/switchr.json"
          manifest = json.load(open(path))
          manifest["version"] = version
          manifest["architecture"]["64bit"]["url"] = f"https://github.com/dominikzabcik/switchr/releases/download/v{version}/{zip_name}"
          manifest["architecture"]["64bit"]["hash"] = digest
          manifest["extract_dir"] = f"switchr-{version}"
          json.dump(manifest, open(path, "w"), indent=4)
          open(path, "a").write("\n")
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Scoop: Switchr $version"
          git push origin HEAD:main
