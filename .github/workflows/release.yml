name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything and write the notes and manifests, but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  STATIC_SDK_URL: https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
  STATIC_SDK_CHECKSUM: 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
  NFPM_VERSION: 2.47.0

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
              echo "VERSION says $version but the tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${{ inputs.dry_run == false }}" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q "static let number = \"$version\"" Sources/Switchr/Core/Version.swift; then
            echo "Sources/Switchr/Core/Version.swift doesn't say $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != tag && "${{ inputs.dry_run }}" == false ]]; then
            echo "Publishing needs a v$version tag; run without dry_run only from the tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: swift test

      - name: Install dmgbuild
        run: pip install dmgbuild

      - name: Build app, zip and disk image
        env:
          SWITCHR_VERSION: ${{ needs.check.outputs.version }}
        run: ./scripts/build-app.sh --release

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            build/Switchr.dmg
            build/Switchr.zip

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            nfpm: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            nfpm: arm64
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the static Linux SDK and nfpm
        run: |
          apt-get update -qq && apt-get install -y -qq curl python3 >/dev/null
          swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz" | tar -xz -C /usr/local/bin nfpm

      - name: Run tests
        run: swift test

      - name: Build the binary and packages
        env:
          SWITCHR_VERSION: ${{ needs.check.outputs.version }}
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: build/linux/*

  windows:
    name: Windows ${{ matrix.arch }}
    needs: check
    # Windows on Arm runs the x86_64 build through emulation: the Swift toolchain doesn't run on
    # GitHub's Arm Windows runners yet.
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: compnerd/gha-setup-swift@v0.4.1
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Run tests
        run: swift test

      - name: Build the zip
        shell: pwsh
        env:
          SWITCHR_VERSION: ${{ needs.check.outputs.version }}
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: build/windows/*.zip

  publish:
    name: ${{ needs.check.outputs.publish == 'true' && 'Publish' || 'Dry run' }}
    needs: [check, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          {
            awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md
            cat <<'NOTES'

          ### Install

          **macOS and Linux**

          ```bash
          curl -fsSL https://raw.githubusercontent.com/dominikzabcik/switchr/main/install.sh | bash
          ```

          **Windows** (PowerShell)

          ```powershell
          irm https://raw.githubusercontent.com/dominikzabcik/switchr/main/install.ps1 | iex
          ```

          | System | Download |
          | --- | --- |
          | macOS 14 or later | `Switchr.dmg`, or `brew install --cask switchr` from this repository's tap |
          | Fedora, RHEL | `switchr-@V@-1.x86_64.rpm` or `.aarch64.rpm` |
          | Debian, Ubuntu | `switchr_@V@_amd64.deb` or `_arm64.deb` |
          | Arch Linux | `switchr-@V@-1-x86_64.pkg.tar.zst` or `-aarch64`, or the `switchr-bin` PKGBUILD |
          | Any Linux | `switchr-@V@-linux-<arch>.tar.gz`, then `./install-local.sh` |
          | Windows 10 and 11 | `switchr-@V@-windows-x86_64.zip` (Windows on Arm runs it too), or `scoop install switchr` from this repository's bucket |

          Every file is listed with its SHA-256 in `SHA256SUMS`.
          NOTES
          } | sed 's/^          //' | sed "s/@V@/$VERSION/g" > dist-notes.md
          cat dist-notes.md

      - name: Render the package manifests
        run: python3 scripts/render-manifests.py --version "$VERSION" --sums dist/SHA256SUMS

      - name: Keep the dry run's output
        if: needs.check.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run
          path: |
            dist/SHA256SUMS
            dist-notes.md
            bucket/switchr.json
            packaging/arch/PKGBUILD
            packaging/winget/

      - name: Publish release
        if: needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* packaging/arch/PKGBUILD \
            --title "Switchr $VERSION" \
            --notes-file dist-notes.md \
            --verify-tag

      - name: Commit the manifests for this release
        if: needs.check.outputs.publish == 'true'
        run: |
          git add bucket/switchr.json packaging/arch/PKGBUILD packaging/winget
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package manifests for Switchr $VERSION"
          git push origin HEAD:main
