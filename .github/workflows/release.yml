name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dmgbuild
        run: pip install dmgbuild

      - name: Check VERSION matches the tag
        run: |
          if [[ "$(cat VERSION)" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "VERSION says $(cat VERSION) but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build app, zip and disk image
        env:
          SWITCHR_VERSION: ${{ github.ref_name }}
        run: ./scripts/build-app.sh --release

      - name: Write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md
            cat <<'NOTES'

          ### Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/dominikzabcik/switchr/main/install.sh | bash
          ```

          Or download **Switchr.dmg**, drag Switchr into Applications, and allow it once in System Settings › Privacy & Security.
          NOTES
          } | sed 's/^          //' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/Switchr.dmg build/Switchr.zip build/SHA256SUMS \
            --title "Switchr ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
