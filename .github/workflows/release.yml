name: Release

# Two channels. A tag like v0.14.6 is a Stable release; a tag with a prerelease, like
# v2.0.0-beta.4, is a Beta, published as a GitHub prerelease that only the Beta channel offers.
# The nightly Beta workflow calls this one with a version and a commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything and write the notes and manifests, but publish nothing
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: The Beta's version, like 2.0.0-beta.4
        type: string
        required: true
      ref:
        description: The commit to build
        type: string
        required: true

permissions:
  contents: read

env:
  STATIC_SDK_URL: https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
  STATIC_SDK_CHECKSUM: 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b
  NFPM_VERSION: 2.47.0

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      channel: ${{ steps.version.outputs.channel }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: version
        env:
          CALLED_VERSION: ${{ inputs.version }}
          CALLED_REF: ${{ inputs.ref }}
        run: |
          # A Beta's version comes from the tag or the caller, never from the files.
          beta=""
          if [[ -n "$CALLED_VERSION" ]]; then
            beta="${CALLED_VERSION#v}"
            echo "ref=$CALLED_REF" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == *-* ]]; then
            beta="${GITHUB_REF_NAME#v}"
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$beta" ]]; then
            if ! [[ "$beta" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$ ]]; then
              echo "$beta isn't a prerelease version like 2.0.0-beta.4" >&2
              exit 1
            fi
            {
              echo "version=$beta"
              echo "channel=beta"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "channel=stable" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
              echo "VERSION says $version but the tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${{ inputs.dry_run == false }}" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q "static let number = \"$version\"" Sources/Keyhop/Core/Version.swift; then
            echo "Sources/Keyhop/Core/Version.swift doesn't say $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != tag && "${{ inputs.dry_run }}" == false ]]; then
            echo "Publishing needs a v$version tag; run without dry_run only from the tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: check
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Stamp the Beta's version
        if: needs.check.outputs.channel == 'beta'
        run: python3 scripts/stamp-version.py "${{ needs.check.outputs.version }}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare Developer ID signing
        if: needs.check.outputs.publish == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::notice::$name isn't set, so this release is built without Developer ID signing."
              exit 0
            fi
          done
          certificate="$RUNNER_TEMP/keyhop-developer-id.p12"
          keychain="$RUNNER_TEMP/keyhop-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then echo "The certificate is not a Developer ID Application identity." >&2; exit 1; fi
          xcrun notarytool store-credentials keyhop-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          {
            echo "KEYHOP_CODESIGN_IDENTITY=$identity"
            echo "KEYHOP_NOTARY_PROFILE=keyhop-notary"
            echo "KEYHOP_NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Install dmgbuild
        run: pip install dmgbuild

      # The GPUI window, where the tree has one (native/). Apple silicon only while it is new.
      - name: Build the native window
        run: |
          if [[ -f native/Cargo.toml ]]; then
            cargo build --release --manifest-path native/Cargo.toml
            echo "KEYHOP_NATIVE_BIN=$PWD/native/target/release/keyhop-native" >> "$GITHUB_ENV"
          fi

      - name: Build app, zip and disk image
        env:
          KEYHOP_VERSION: ${{ needs.check.outputs.version }}
        run: ./scripts/build-app.sh --release

      - name: Verify the notarized app
        if: needs.check.outputs.publish == 'true' && env.KEYHOP_CODESIGN_IDENTITY != ''
        run: |
          codesign --verify --deep --strict --verbose=2 build/Keyhop.app
          xcrun stapler validate build/Keyhop.app
          xcrun stapler validate build/Keyhop.dmg
          spctl --assess --type execute --verbose=2 build/Keyhop.app

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            build/Keyhop.dmg
            build/Keyhop.zip

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            nfpm: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            nfpm: arm64
    runs-on: ${{ matrix.runner }}
    container: swift:6.3.3-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Install the static Linux SDK and nfpm
        run: |
          # Ubuntu's mirror sometimes serves a half-synced index; retry, then switch to another mirror.
          for _ in 1 2 3; do
            apt-get update -qq || true
            if apt-get install -y -qq curl python3 >/dev/null; then break; fi
            sed -i 's|http://archive.ubuntu.com/ubuntu|http://mirrors.edge.kernel.org/ubuntu|g; s|http://ports.ubuntu.com/ubuntu-ports|http://mirrors.edge.kernel.org/ubuntu-ports|g' /etc/apt/sources.list.d/ubuntu.sources || true
            sleep 15
          done
          command -v curl >/dev/null
          swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz" | tar -xz -C /usr/local/bin nfpm

      - name: Stamp the Beta's version
        if: needs.check.outputs.channel == 'beta'
        run: python3 scripts/stamp-version.py "${{ needs.check.outputs.version }}"

      - name: Run tests
        run: swift test

      - name: Build the binary and packages
        env:
          KEYHOP_VERSION: ${{ needs.check.outputs.version }}
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: build/linux/*

  windows:
    name: Windows ${{ matrix.arch }}
    needs: check
    # Windows on Arm runs the x86_64 build through emulation: the Swift toolchain doesn't run on
    # GitHub's Arm Windows runners yet.
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Stamp the Beta's version
        if: needs.check.outputs.channel == 'beta'
        run: python scripts/stamp-version.py "${{ needs.check.outputs.version }}"

      - uses: compnerd/gha-setup-swift@v0.5.0
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Run tests
        run: swift test

      - name: Prepare Authenticode signing
        if: needs.check.outputs.publish == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host '::notice::Authenticode secrets are not set, so this release is built unsigned.'
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'keyhop-authenticode.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          "KEYHOP_WINDOWS_CERTIFICATE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KEYHOP_WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the zip
        shell: pwsh
        env:
          KEYHOP_VERSION: ${{ needs.check.outputs.version }}
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: build/windows/*.zip

  publish:
    name: ${{ needs.check.outputs.publish == 'true' && 'Publish' || 'Dry run' }}
    needs: [check, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.channel == 'beta' && needs.check.outputs.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Add stable download names
        if: needs.check.outputs.channel == 'stable'
        run: |
          cp "dist/keyhop-$VERSION-windows-x86_64.zip" dist/Keyhop-Windows-x86_64.zip
          cp "dist/keyhop-$VERSION-linux-x86_64.tar.gz" dist/Keyhop-Linux-x86_64.tar.gz
          cp "dist/keyhop-$VERSION-linux-aarch64.tar.gz" dist/Keyhop-Linux-aarch64.tar.gz

      - name: Write checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Write the Beta's notes
        if: needs.check.outputs.channel == 'beta'
        run: |
          previous="$(git tag --list 'v*-*' --sort=-v:refname | grep -vx "v$VERSION" | head -n 1 || true)"
          if [[ -n "$previous" ]]; then range="$previous..HEAD"; since="since $previous"; else range="origin/main..HEAD"; since="since the last Stable release"; fi
          {
            echo "**Keyhop $VERSION is a Beta**: a nightly build of the next version. It might have rough edges; Stable stays on the tested releases."
            echo
            echo "### What changed $since"
            echo
            git log --no-merges --pretty='- %s' $range | head -n 60
            cat <<'NOTES'

          ### Try it

          **macOS and Linux**

          ```bash
          curl -fsSL https://raw.githubusercontent.com/dominikzabcik/keyhop/main/install.sh | bash -s -- --beta
          ```

          **Windows** (PowerShell)

          ```powershell
          & ([scriptblock]::Create((irm https://raw.githubusercontent.com/dominikzabcik/keyhop/main/install.ps1))) -Beta
          ```

          Keyhop then follows the Beta channel and updates itself every night there is something new.
          Go back to tested releases under Settings, App & Privacy, Update channel, or with `keyhop update channel stable`.
          NOTES
          } | sed 's/^          //' > dist-notes.md
          cat dist-notes.md

      - name: Write release notes
        if: needs.check.outputs.channel == 'stable'
        run: |
          {
            awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md
            cat <<'NOTES'

          ### Install

          **macOS and Linux**

          ```bash
          curl -fsSL https://raw.githubusercontent.com/dominikzabcik/keyhop/main/install.sh | bash
          ```

          **Windows** (PowerShell)

          ```powershell
          irm https://raw.githubusercontent.com/dominikzabcik/keyhop/main/install.ps1 | iex
          ```

          | System | Download |
          | --- | --- |
          | macOS 14 or later | `Keyhop.dmg`, or `brew install --cask keyhop` from this repository's tap |
          | Fedora, RHEL | `keyhop-@V@-1.x86_64.rpm` or `.aarch64.rpm` |
          | Debian, Ubuntu | `keyhop_@V@_amd64.deb` or `_arm64.deb` |
          | Arch Linux | `keyhop-@V@-1-x86_64.pkg.tar.zst` or `-aarch64`, or the `keyhop-bin` PKGBUILD |
          | Any Linux | `keyhop-@V@-linux-<arch>.tar.gz`, then `./install-local.sh` |
          | Windows 10 and 11 | `keyhop-@V@-windows-x86_64.zip` (Windows on Arm runs it too), or `scoop install keyhop` from this repository's bucket |

          `Keyhop.dmg`, `Keyhop-Linux-x86_64.tar.gz`, `Keyhop-Linux-aarch64.tar.gz` and `Keyhop-Windows-x86_64.zip` always point at the newest release, so a link to one of them keeps working. The versioned names above pin this release.

          Every file is listed with its SHA-256 in `SHA256SUMS`.
          NOTES
          } | sed 's/^          //' | sed "s/@V@/$VERSION/g" > dist-notes.md
          cat dist-notes.md

      - name: Render the package manifests
        if: needs.check.outputs.channel == 'stable'
        run: python3 scripts/render-manifests.py --version "$VERSION" --sums dist/SHA256SUMS

      - name: Keep the dry run's output
        if: needs.check.outputs.publish != 'true' && needs.check.outputs.channel == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run
          path: |
            dist/SHA256SUMS
            dist-notes.md
            bucket/keyhop.json
            packaging/arch/PKGBUILD
            packaging/winget/

      - name: Publish the Beta
        if: needs.check.outputs.publish == 'true' && needs.check.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          target="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            gh release create "v$VERSION" dist/* --title "Keyhop $VERSION" --notes-file dist-notes.md --prerelease --verify-tag
          else
            gh release create "v$VERSION" dist/* --title "Keyhop $VERSION" --notes-file dist-notes.md --prerelease --target "$target"
          fi
          # Keep the fifteen newest Betas; older ones are history, and Stable is never touched.
          gh release list --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' \
            | sort -V -r | tail -n +16 | while read -r old; do
              gh release delete "$old" --cleanup-tag --yes
            done

      - name: Publish release
        if: needs.check.outputs.publish == 'true' && needs.check.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* packaging/arch/PKGBUILD \
            --title "Keyhop $VERSION" \
            --notes-file dist-notes.md \
            --verify-tag

      - name: Commit the manifests for this release
        if: needs.check.outputs.publish == 'true' && needs.check.outputs.channel == 'stable'
        run: |
          git add bucket/keyhop.json packaging/arch/PKGBUILD packaging/winget
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package manifests for Keyhop $VERSION"
          git push origin HEAD:main
