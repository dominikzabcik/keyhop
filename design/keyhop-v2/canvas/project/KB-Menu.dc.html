<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#111111}
a{color:inherit;text-decoration:none}
input::placeholder{color:inherit;opacity:.6}
button{font:inherit;cursor:default}
a,button{transition:background-color .15s ease,filter .15s ease,transform .15s ease}
.side a:hover,.side button:hover{background-color:rgba(255,255,255,.05)}
.side a[aria-current="page"]:hover{background-color:rgba(255,255,255,.09)}
button:hover{filter:brightness(1.12)}
button:active{filter:brightness(.92);transform:scale(.98)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #60A5FA;outline-offset:2px}
.glass{background:#1A1A1A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);border-radius:8px}
.well{background:#1F1F1F;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:6px}
.card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}
.card:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
@media (prefers-reduced-motion: no-preference){
  .pet{animation:hop 2.4s cubic-bezier(.3,.7,.3,1) infinite;transform-origin:50% 100%}
  @keyframes hop{0%,55%,100%{transform:translateY(0) scale(1,1)}62%{transform:translateY(0) scale(1.08,.9)}75%{transform:translateY(-16px) scale(.96,1.05)}88%{transform:translateY(0) scale(1.05,.94)}}
  .shadow{animation:shade 2.4s cubic-bezier(.3,.7,.3,1) infinite}
  @keyframes shade{0%,55%,100%{transform:scaleX(1);opacity:.45}75%{transform:scaleX(.6);opacity:.2}}
  .star{animation:twinkle 3.2s ease-in-out infinite;animation-delay:calc(var(--i) * -0.37s)}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.55}}
  .grow{animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 70ms + 200ms);transform-origin:0 50%}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 45ms + 300ms);transform-origin:50% 100%}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 6ms + 400ms)}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .live{animation:live 1.6s ease-out infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}
  .bubble{animation:bubble .6s cubic-bezier(.2,.8,.2,1) .9s both}
  @keyframes bubble{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
  .today{animation:today 1.8s ease-in-out infinite}
  @keyframes today{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
}

.glass{background:#1A1A1A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);border-radius:12px}
.well{background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:10px}
.card:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
h2[id$="-h"]:not(#total-h){font-family:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace!important;text-transform:uppercase;letter-spacing:.16em;font-size:11px!important;font-weight:500!important;color:#A3A3A3!important}
.lab{font-family:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace!important;text-transform:uppercase;letter-spacing:.16em;font-size:11px!important;font-weight:500!important;color:#A3A3A3!important}
.sans{font-family:'Geist', system-ui, sans-serif!important}
.tiles>div{box-shadow:inset 1px 0 0 rgba(255,255,255,.08)}.tiles>div:first-child{box-shadow:none;padding-left:0!important}.alert+.alert{box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
