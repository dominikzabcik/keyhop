<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyhop Menu — Coss Blue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#111111}
a{color:inherit;text-decoration:none}
input::placeholder{color:inherit;opacity:.6}
button{font:inherit;cursor:default}
a,button{transition:background-color .15s ease,filter .15s ease,transform .15s ease}
.side a:hover,.side button:hover{background-color:rgba(255,255,255,.05)}
.side a[aria-current="page"]:hover{background-color:rgba(255,255,255,.09)}
button:hover{filter:brightness(1.12)}
button:active{filter:brightness(.92);transform:scale(.98)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #60A5FA;outline-offset:2px}
.glass{background:#1A1A1A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);border-radius:8px}
.well{background:#1F1F1F;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:6px}
.card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}
.card:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
@media (prefers-reduced-motion: no-preference){
  .pet{animation:hop 2.4s cubic-bezier(.3,.7,.3,1) infinite;transform-origin:50% 100%}
  @keyframes hop{0%,55%,100%{transform:translateY(0) scale(1,1)}62%{transform:translateY(0) scale(1.08,.9)}75%{transform:translateY(-16px) scale(.96,1.05)}88%{transform:translateY(0) scale(1.05,.94)}}
  .shadow{animation:shade 2.4s cubic-bezier(.3,.7,.3,1) infinite}
  @keyframes shade{0%,55%,100%{transform:scaleX(1);opacity:.45}75%{transform:scaleX(.6);opacity:.2}}
  .star{animation:twinkle 3.2s ease-in-out infinite;animation-delay:calc(var(--i) * -0.37s)}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.55}}
  .grow{animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 70ms + 200ms);transform-origin:0 50%}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 45ms + 300ms);transform-origin:50% 100%}
  @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i, 0) * 6ms + 400ms)}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .live{animation:live 1.6s ease-out infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}
  .bubble{animation:bubble .6s cubic-bezier(.2,.8,.2,1) .9s both}
  @keyframes bubble{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
  .today{animation:today 1.8s ease-in-out infinite}
  @keyframes today{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
}

.glass{background:#1A1A1A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);border-radius:12px}
.well{background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:10px}
.card:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
h2[id$="-h"]:not(#total-h){font-family:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace!important;text-transform:uppercase;letter-spacing:.16em;font-size:11px!important;font-weight:500!important;color:#A3A3A3!important}
.lab{font-family:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace!important;text-transform:uppercase;letter-spacing:.16em;font-size:11px!important;font-weight:500!important;color:#A3A3A3!important}
.sans{font-family:'Geist', system-ui, sans-serif!important}
</style>
</helmet>
<div style="position: relative; width: 560px; height: 760px; overflow: hidden; background: radial-gradient(70% 50% at 70% 100%, rgba(96,165,250,0.18), transparent 70%), linear-gradient(180deg, #1B1D22, #0E0F12); font-family: 'Geist', system-ui, sans-serif; font-size: 13px; line-height: 18px; color: {{c.label}}; font-variant-numeric: tabular-nums">
  <div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px; height: 26px; padding: 0 14px; background: rgba(20,20,22,0.72); box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06); font-size: 12.5px; font-weight: 500; color: #E5E5E5">
    <span style="display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border-radius: 5px; background: rgba(255,255,255,0.12)"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true" shape-rendering="crispEdges"><rect x="2" y="2" width="3" height="10" fill="currentColor"></rect><rect x="6" y="5" width="3" height="3" fill="currentColor"></rect><rect x="9" y="2" width="3" height="3" fill="currentColor"></rect><rect x="9" y="9" width="3" height="3" fill="currentColor"></rect></svg><span style="color: #FF8A82">7%</span></span>
    <span>Tue 13 Oct</span><span>10:52</span>
  </div>

  <div role="dialog" aria-label="Keyhop" style="position: absolute; top: 34px; right: 40px; width: 360px; display: flex; flex-direction: column; border-radius: 12px; background: #1A1A1A; box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 24px 60px rgba(0,0,0,0.55)">
    <div style="display: flex; align-items: center; gap: 14px; padding: 18px 18px 16px">
      <span style="flex: none; width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; background: radial-gradient(90% 70% at 50% 100%, rgba(96,165,250,0.30), transparent 70%), #13151A; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)"><svg width="40" height="40" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Your pet, Bulk, hopping"><rect x="9" y="1" width="2" height="4" fill="#FFF4E2"></rect><rect x="8" y="4" width="5" height="4" fill="#FFF4E2"></rect><rect x="11" y="5" width="1" height="1" fill="#2B2420"></rect><rect x="3" y="7" width="10" height="4" fill="#FFF4E2"></rect><rect x="3" y="11" width="10" height="1" fill="#E8D7BC"></rect><rect x="4" y="12" width="2" height="2" fill="#FFF4E2"></rect><rect x="10" y="12" width="2" height="2" fill="#FFF4E2"></rect><rect x="1" y="8" width="2" height="2" fill="#FF8A3D"></rect><rect x="12" y="9" width="3" height="3" fill="#FF8A3D"></rect></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span class="lab">Bulk · 8 logins</span>
        <span class="sans" style="font-size: 22px; line-height: 26px; font-weight: 500; letter-spacing: -0.02em">415% left</span>
        <span style="font-size: 12px; color: {{c.secondary}}">Next reset +35% at 12:41</span>
      </span>
      <button type="button" aria-label="Refresh limits" style="flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.10); border-radius: 8px; background: transparent; color: {{c.secondary}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg></button>
    </div>

    <div style="margin: 0 12px; display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; background: rgba(251,65,74,0.08); box-shadow: inset 0 0 0 1px rgba(251,65,74,0.22)">
      <span style="flex: none; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: rgba(251,65,74,0.18); color: #FF8A82; font-weight: 700">!</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 16px"><span style="font-weight: 600">Codex is nearly out</span><span style="font-size: 12px; color: {{c.secondary}}">Runs out around 11:19 AM</span></span>
      <button type="button" style="flex: none; height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.10); border-radius: 8px; background: transparent; color: #E5E5E5; font-size: 12px; font-weight: 600">Add a login</button>
    </div>

    <div class="lab" style="padding: 20px 20px 8px">In use</div>
    <div style="display: flex; flex-direction: column; padding: 0 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <a href="#limits" style="display: grid; grid-template-columns: 28px minmax(0, 1fr) 40px; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 8px">
          <span style="width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 600; color: #E5E5E5">{{r.mark}}</span>
          <span style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="display: flex; align-items: baseline; gap: 8px; line-height: 16px"><span style="font-weight: 600">{{r.tool}}</span><span style="flex: 1; min-width: 0; text-align: right; font-size: 12px; color: {{c.tertiary}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.login}}</span></span>
            <span style="height: 4px; border-radius: 2px; background: {{c.track}}; overflow: hidden"><span class="grow" style="--i: {{$index}}; display: block; height: 4px; width: {{r.w}}; border-radius: 2px; background: {{r.bar}}"></span></span>
          </span>
          <span style="text-align: right; font-weight: 600; color: {{r.ink}}">{{r.pct}}</span>
        </a>
      </sc-for>
    </div>

    <div style="margin: 10px 12px 0; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: rgba(96,165,250,0.08); box-shadow: inset 0 0 0 1px rgba(96,165,250,0.22)">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 16px"><span style="font-weight: 600">work@studio.dev has more room</span><span style="font-size: 12px; color: {{c.secondary}}">Claude Code · 59% left this week</span></span>
      <button type="button" style="flex: none; height: 28px; padding: 0 14px; border: 0; border-radius: 8px; background: {{c.accent}}; color: {{c.accentInk}}; font-size: 12px; font-weight: 600">Hop</button>
    </div>

    <div style="height: 1px; margin: 12px 0 6px; background: rgba(255,255,255,0.07)"></div>
    <div style="display: flex; flex-direction: column; padding: 0 8px 8px">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 12px; border-radius: 8px; color: #E5E5E5">{{m.name}}<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: {{c.tertiary}}">{{m.key}}</span></a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = '#60A5FA';
    const rgba = (h, a) => { const n = parseInt(String(h).replace('#', '').slice(0, 6), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const sys = { green: '#34D399', orange: '#F59E0B', red: '#FB414A' };
    const c = Object.assign({ label: '#F5F5F5', secondary: '#A3A3A3', tertiary: '#737373', track: 'rgba(255,255,255,0.08)', accent: accent, accentInk: '#0A1628', redInk: '#FF8A82' }, sys);
    const rows = [['Cx', 'Codex', 'me@personal.dev', 7], ['CC', 'Claude Code', 'Personal', 49], ['Cu', 'Cursor', 'me@personal.dev', 38], ['GH', 'Copilot', 'Personal', 53], ['G', 'Gemini CLI', 'me@personal.dev', 72], ['W', 'Windsurf', 'me@windsurf.dev', 67]]
      .map((r) => ({ mark: r[0], tool: r[1], login: r[2], pct: r[3] + '%', w: r[3] + '%',
        bar: r[3] <= 15 ? c.red : r[3] <= 40 ? c.orange : 'rgba(255,255,255,0.78)', ink: r[3] <= 15 ? c.redInk : c.label }));
    const menu = [['Open Keyhop', '⌘O'], ['Refresh limits', '⌘R'], ['Quit Keyhop', '⌘Q']].map((m) => ({ name: m[0], key: m[1] }));
    const extra = { rows: rows, menu: menu };
    return Object.assign({ c: c }, extra);
  }
}
</script>
</body>
</html>
