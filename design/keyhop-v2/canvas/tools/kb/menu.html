<div style="position: relative; width: 560px; height: 660px; overflow: hidden; background: radial-gradient(70% 50% at 70% 100%, rgba(96,165,250,0.18), transparent 70%), linear-gradient(180deg, #1B1D22, #0E0F12); font-family: 'Geist', system-ui, sans-serif; font-size: 13px; line-height: 18px; color: {{c.label}}; font-variant-numeric: tabular-nums">
  <div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px; height: 26px; padding: 0 14px; background: rgba(20,20,22,0.72); box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06); font-size: 12.5px; font-weight: 500; color: #E5E5E5">
    <span style="display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border-radius: 5px; background: rgba(255,255,255,0.12)"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true" shape-rendering="crispEdges"><rect x="2" y="2" width="3" height="10" fill="currentColor"></rect><rect x="6" y="5" width="3" height="3" fill="currentColor"></rect><rect x="9" y="2" width="3" height="3" fill="currentColor"></rect><rect x="9" y="9" width="3" height="3" fill="currentColor"></rect></svg><span style="color: #FF8A82">7%</span></span>
    <span>Tue 13 Oct</span><span>10:52</span>
  </div>

  <div role="dialog" aria-label="Keyhop" style="position: absolute; top: 34px; right: 40px; width: 360px; display: flex; flex-direction: column; border-radius: 12px; background: #1A1A1A; box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 24px 60px rgba(0,0,0,0.55); overflow: hidden">
<div style="position: relative; height: 132px; overflow: hidden; background: radial-gradient(80% 70% at 75% 100%, rgba(96,165,250,0.32), transparent 72%), #13151A">
      <svg viewBox="0 0 360 132" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="24"><rect class="star" style="--i: {{$index}}" x="{{s.x}}" y="{{s.y}}" width="{{s.r}}" height="{{s.r}}" fill="#FFFFFF"></rect></sc-for>
        <path d="M0 108 C 60 96 130 100 190 104 C 250 108 310 94 360 98 L360 132 L0 132 Z" fill="#1C1F26"></path>
        <path d="M0 122 C 90 114 190 116 270 120 C 320 122 345 121 360 120 L360 132 L0 132 Z" fill="#171A20"></path>
      </svg>
      <div style="position: absolute; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 2px">
        <span class="lab">Bulk · 8 logins</span>
        <span class="sans" style="font-size: 30px; line-height: 34px; font-weight: 500; letter-spacing: -0.03em">415% left</span>
        <span style="font-size: 12px; color: {{c.secondary}}">Next reset +35% at 12:41</span>
      </div>
      <div style="position: absolute; right: 26px; bottom: 10px; display: flex; flex-direction: column; align-items: center">{{PET:48}}<span class="shadow" style="width: 36px; height: 6px; margin-top: 1px; border-radius: 50%; background: #000000; opacity: .45"></span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px 12px 12px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; border-radius: 10px; background: {{r.tileBg}}; box-shadow: {{r.tileRing}}">
          <span style="position: relative; width: 52px; height: 52px">
            <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)"><circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"></circle><circle cx="26" cy="26" r="22" fill="none" stroke="{{r.ringInk}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="{{r.dash}}"></circle></svg>
            <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #E5E5E5">{{ICON:r.ic:18}}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: center; line-height: 15px"><span class="sans" style="font-size: 15px; line-height: 18px; font-weight: 600; color: {{r.ink}}">{{r.pct}}</span><span style="font-size: 11.5px; color: {{c.secondary}}">{{r.tool}}</span></span>
        </div>
      </sc-for>
    </div>
    <div style="margin: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 10px; background: radial-gradient(80% 120% at 100% 100%, rgba(96,165,250,0.20), transparent 70%), #13151A; box-shadow: inset 0 0 0 1px rgba(96,165,250,0.25)">
      <span style="display: flex; align-items: center; gap: 10px"><span style="color: #E5E5E5">{{ICON:claudeIc:16}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 16px"><b style="font-weight: 600">Claude Code is at 81%</b><span style="font-size: 12px; color: {{c.secondary}}">work@studio.dev has 88% left</span></span></span>
      <span style="height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{c.accent}}; color: {{c.accentInk}}; font-weight: 600">Hop to work@studio.dev</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; font-size: 12px; color: #FF8A82"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{c.red}}"></span>Codex runs out at 11:19 · no other login<span style="flex: 1"></span><span style="color: #E5E5E5; font-weight: 600">Add</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07)">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="3"><span style="height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #E5E5E5; box-shadow: {{m.line}}">{{m.short}}<kbd style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; color: {{c.tertiary}}">{{m.key}}</kbd></span></sc-for>
    </div>
  </div>
</div>
