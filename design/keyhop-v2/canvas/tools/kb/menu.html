<div style="position: relative; width: 560px; height: 760px; overflow: hidden; background: radial-gradient(70% 50% at 70% 100%, rgba(96,165,250,0.18), transparent 70%), linear-gradient(180deg, #1B1D22, #0E0F12); font-family: 'Geist', system-ui, sans-serif; font-size: 13px; line-height: 18px; color: {{c.label}}; font-variant-numeric: tabular-nums">
  <div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px; height: 26px; padding: 0 14px; background: rgba(20,20,22,0.72); box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06); font-size: 12.5px; font-weight: 500; color: #E5E5E5">
    <span style="display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border-radius: 5px; background: rgba(255,255,255,0.12)"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true" shape-rendering="crispEdges"><rect x="2" y="2" width="3" height="10" fill="currentColor"></rect><rect x="6" y="5" width="3" height="3" fill="currentColor"></rect><rect x="9" y="2" width="3" height="3" fill="currentColor"></rect><rect x="9" y="9" width="3" height="3" fill="currentColor"></rect></svg><span style="color: #FF8A82">7%</span></span>
    <span>Tue 13 Oct</span><span>10:52</span>
  </div>

  <div role="dialog" aria-label="Keyhop" style="position: absolute; top: 34px; right: 40px; width: 360px; display: flex; flex-direction: column; border-radius: 12px; background: #1A1A1A; box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 24px 60px rgba(0,0,0,0.55)">
    <div style="display: flex; align-items: center; gap: 14px; padding: 18px 18px 16px">
      <span style="flex: none; width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; background: radial-gradient(90% 70% at 50% 100%, rgba(96,165,250,0.30), transparent 70%), #13151A; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)">{{PET:40:still}}</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span class="lab">Bulk · 8 logins</span>
        <span class="sans" style="font-size: 22px; line-height: 26px; font-weight: 500; letter-spacing: -0.02em">415% left</span>
        <span style="font-size: 12px; color: {{c.secondary}}">Next reset +35% at 12:41</span>
      </span>
      <button type="button" aria-label="Refresh limits" style="flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.10); border-radius: 8px; background: transparent; color: {{c.secondary}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg></button>
    </div>

    <div style="margin: 0 12px; display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; background: rgba(251,65,74,0.08); box-shadow: inset 0 0 0 1px rgba(251,65,74,0.22)">
      <span style="flex: none; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: rgba(251,65,74,0.18); color: #FF8A82; font-weight: 700">!</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 16px"><span style="font-weight: 600">Codex is nearly out</span><span style="font-size: 12px; color: {{c.secondary}}">Runs out around 11:19 AM</span></span>
      <button type="button" style="flex: none; height: 28px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.10); border-radius: 8px; background: transparent; color: #E5E5E5; font-size: 12px; font-weight: 600">Add a login</button>
    </div>

    <div class="lab" style="padding: 20px 20px 8px">In use</div>
    <div style="display: flex; flex-direction: column; padding: 0 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <a href="#limits" style="display: grid; grid-template-columns: 28px minmax(0, 1fr) 40px; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 8px">
          <span style="width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 600; color: #E5E5E5">{{r.mark}}</span>
          <span style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="display: flex; align-items: baseline; gap: 8px; line-height: 16px"><span style="font-weight: 600">{{r.tool}}</span><span style="flex: 1; min-width: 0; text-align: right; font-size: 12px; color: {{c.tertiary}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.login}}</span></span>
            <span style="height: 4px; border-radius: 2px; background: {{c.track}}; overflow: hidden"><span class="grow" style="--i: {{$index}}; display: block; height: 4px; width: {{r.w}}; border-radius: 2px; background: {{r.bar}}"></span></span>
          </span>
          <span style="text-align: right; font-weight: 600; color: {{r.ink}}">{{r.pct}}</span>
        </a>
      </sc-for>
    </div>

    <div style="margin: 10px 12px 0; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: rgba(96,165,250,0.08); box-shadow: inset 0 0 0 1px rgba(96,165,250,0.22)">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 16px"><span style="font-weight: 600">work@studio.dev has more room</span><span style="font-size: 12px; color: {{c.secondary}}">Claude Code · 59% left this week</span></span>
      <button type="button" style="flex: none; height: 28px; padding: 0 14px; border: 0; border-radius: 8px; background: {{c.accent}}; color: {{c.accentInk}}; font-size: 12px; font-weight: 600">Hop</button>
    </div>

    <div style="height: 1px; margin: 12px 0 6px; background: rgba(255,255,255,0.07)"></div>
    <div style="display: flex; flex-direction: column; padding: 0 8px 8px">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 12px; border-radius: 8px; color: #E5E5E5">{{m.name}}<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: {{c.tertiary}}">{{m.key}}</span></a>
      </sc-for>
    </div>
  </div>
</div>
