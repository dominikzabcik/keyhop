# The iOS companion, generated with `bash scripts/generate-ios-project.sh`. The project itself is
# not committed: this file is the source of truth, so the app is described in one readable place.
#
# It compiles two files from the Mac app - the cloud shapes and client, and the version - so the
# phone and the Mac read the website the same way. Everything else here is the app's own.
name: Keyhop
options:
  bundleIdPrefix: app.keyhop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  Keyhop:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Sources/Keyhop/Cloud/CloudAPI.swift
        group: Shared
      - path: ../Sources/Keyhop/Core/Version.swift
        group: Shared
      - path: Resources
        buildPhase: resources
      - path: .generated/Assets.xcassets
        group: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Keyhop
        CFBundleShortVersionString: "${KEYHOP_VERSION}"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keyhop.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  KeyhopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Keyhop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keyhop.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Keyhop:
    build:
      targets:
        Keyhop: all
        KeyhopTests: [test]
    test:
      targets:
        - KeyhopTests
