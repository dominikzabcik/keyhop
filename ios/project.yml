# The iOS companion, generated with `xcodegen generate --spec ios/project.yml`. The project itself is
# not committed: this file is the source of truth, so the app is described in one readable place.
#
# It compiles two files from the Mac app - the cloud shapes and client, and the version - so the
# phone and the Mac read the website the same way. Everything else here is the app's own.
name: Keyhop
options:
  bundleIdPrefix: app.keyhop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Keyhop:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Sources/Keyhop/Cloud/CloudAPI.swift
        group: Shared
      - path: ../Sources/Keyhop/Core/Version.swift
        group: Shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Keyhop
        CFBundleShortVersionString: "0.9.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keyhop.ios
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
