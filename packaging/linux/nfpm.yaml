# RPM, DEB and Arch packages from one description. scripts/package-linux.sh sets the variables
# and stages the binary, and runs nfpm from the repository root.
name: keyhop
arch: ${NFPM_ARCH}
platform: linux
version: ${KEYHOP_VERSION}
release: 1
section: devel
priority: optional
maintainer: dominikzabcik <35886301+dominikzabcik@users.noreply.github.com>
description: |
  Switch Claude Code, Cursor and Codex accounts in one click and track their usage.
  Includes the keyhop command and a tray menu with limits, alerts and Insights.
vendor: Keyhop
homepage: https://github.com/dominikzabcik/switchr
license: MIT

contents:
  - src: build/linux/package-root/keyhop
    dst: /usr/bin/keyhop
    file_info:
      mode: 0755
  - src: packaging/linux/keyhop-tray
    dst: /usr/bin/keyhop-tray
    file_info:
      mode: 0755
  - src: packaging/linux/app.keyhop.Keyhop.desktop
    dst: /usr/share/applications/app.keyhop.Keyhop.desktop
  - src: packaging/linux/app.keyhop.Keyhop.metainfo.xml
    dst: /usr/share/metainfo/app.keyhop.Keyhop.metainfo.xml
  - src: packaging/icons/keyhop-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/app.keyhop.Keyhop.png
  - src: packaging/icons/keyhop-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/app.keyhop.Keyhop.png
  - src: packaging/icons/keyhop-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/app.keyhop.Keyhop.png
  - src: packaging/icons/keyhop-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/app.keyhop.Keyhop.png
  - src: packaging/icons/keyhop-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/app.keyhop.Keyhop.png
  - src: packaging/icons/keyhop-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/app.keyhop.Keyhop.png
  - src: packaging/icons/keyhop-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/app.keyhop.Keyhop.png
  - src: packaging/icons/keyhop-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/app.keyhop.Keyhop.png
  - src: LICENSE
    dst: /usr/share/licenses/keyhop/LICENSE
  - src: README.md
    dst: /usr/share/doc/keyhop/README.md

overrides:
  rpm:
    depends:
      - python3-gobject
      - gtk3
      - libayatana-appindicator-gtk3
      - libnotify
      - ca-certificates
    recommends:
      - libsecret
      - gnome-shell-extension-appindicator
      - webkit2gtk4.1
  deb:
    depends:
      - python3
      - python3-gi
      - gir1.2-gtk-3.0
      - gir1.2-ayatanaappindicator3-0.1
      - gir1.2-notify-0.7
      - ca-certificates
    recommends:
      - libsecret-tools
      - gnome-shell-extension-appindicator
      - gir1.2-webkit2-4.1
  archlinux:
    depends:
      - python-gobject
      - gtk3
      - libayatana-appindicator
      - libnotify
      - libsecret
      - ca-certificates

rpm:
  summary: Switch AI coding accounts and track their usage
  compression: zstd
deb:
  compression: zstd
